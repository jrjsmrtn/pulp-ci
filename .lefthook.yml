#
# Only gates that can run without building the image. The build takes minutes
# and needs a running podman machine, so it belongs in `bin/measure.sh` and in
# CI, not on every commit.
---
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose

    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    shfmt:
      glob: "*.sh"
      run: shfmt --diff {staged_files}

    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint -c .yamllint.yml {staged_files}

    # A tag or branch can be moved to different code after review; a commit
    # SHA cannot. Local actions (`./…`) have no ref and are exempt.
    actions-pinned:
      glob: ".github/workflows/*.{yml,yaml}"
      run: >-
        ! grep -nE '^\s*-?\s*uses:\s*[^.[:space:]][^@[:space:]]*@' {staged_files}
        | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'

    reuse:
      run: 'reuse lint -q && echo "✓ reuse: compliant"'
