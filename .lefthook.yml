#
# Only gates that can run without building the image. The build takes minutes
# and needs a running podman machine, so it belongs in `bin/measure.sh` and in
# CI, not on every commit.
---
# DCO (ADR-0004): this gate REJECTS an unsigned commit rather than signing for you.
# git deliberately has no `commit.signoff` setting: a trailer added automatically
# could have been added without the committer's awareness, which is the one thing
# the sign-off exists to rule out. Contributors run none of these hooks, so pull
# requests are checked in CI by bin/check-dco.sh.
commit-msg:
  commands:
    dco-signoff:
      # {1} is the path to the prepared commit message.
      run: >
        if [ -f "$(git rev-parse --git-dir)/MERGE_HEAD" ]; then
          exit 0;
        elif grep -qiE '^Signed-off-by: .+ <[^>]+@[^>]+>' "{1}"; then
          exit 0;
        else
          echo "FAIL: no Signed-off-by trailer. This project uses the DCO.";
          echo "  sign off:   git commit -s";
          echo "  fix last:   git commit -s --amend --no-edit";
          echo "  fix branch: git rebase --signoff develop";
          echo "  terms:      CONTRIBUTING.md -> Contribution terms";
          exit 1;
        fi

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose

    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    shfmt:
      glob: "*.sh"
      run: shfmt --diff {staged_files}

    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint -c .yamllint.yml {staged_files}

    # A tag or branch can be moved to different code after review; a commit
    # SHA cannot. Local actions (`./…`) have no ref and are exempt.
    actions-pinned:
      glob: ".github/workflows/*.{yml,yaml}"
      run: >-
        ! grep -nE '^\s*-?\s*uses:\s*[^.[:space:]][^@[:space:]]*@' {staged_files}
        | grep -vE '@[0-9a-f]{40}([[:space:]]|$)'

    # A base image tag can be repointed upstream; a digest cannot. Every FROM
    # must carry a full sha256 digest, except a reference to an earlier stage
    # (`build`) or `scratch`. FROM is matched case-insensitively, as podman
    # and Docker read it.
    base-pinned:
      glob: "{Containerfile,Dockerfile}*"
      run: >-
        s='[[:space:]]';
        ! grep -niE "^$s*FROM$s" {staged_files}
        | grep -vE "@sha256:[0-9a-f]{64}($s|\$)"
        | grep -viE "FROM$s+(--platform=[^[:space:]]+$s+)?(build|scratch)($s|\$)"

    reuse:
      run: 'reuse lint -q && echo "✓ reuse: compliant"'
