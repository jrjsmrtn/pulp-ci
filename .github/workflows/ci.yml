#
# Proves the image still builds and still serves a usable Pulp API.
#
# There is no unit-test suite to run here (ADR-0002): the deliverable is an
# image, and the only meaningful assertion about it is that a client can drive
# the API through it. That assertion is `bin/smoke-test.sh`.
#
# Nothing in this workflow publishes the image. It is pushed by hand to an
# internal registry that a hosted runner cannot reach.
---
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: build the image and exercise the API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail here with an obvious message rather than three steps later with a
      # confusing one.
      - name: Check compose is available
        run: docker compose version

      # `--wait` blocks until every healthcheck passes and exits non-zero if one
      # never does, so this single command is the readiness gate -- no sleeps.
      # The pulp healthcheck in compose.ci.yml encodes the real criterion
      # (database connected AND a worker online), not merely an open port.
      - name: Build and start the stack
        id: build
        run: docker compose -f compose.ci.yml up --build --detach --wait

      - name: Exercise the API
        run: ./bin/smoke-test.sh http://localhost:24817 password

      # cosign-installer installs the cosign release it ships with and checks it
      # against a digest pinned inside the action.
      - name: Install cosign
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A checksum alone only proves the download matches a checksums file from
      # the same release, so a compromised release would pass. The signature
      # proves the checksums file was produced by grype's own release workflow
      # on its main branch; the checksum then ties the binary to that file.
      # Both checks were run against tampered input before being trusted here.
      - name: Install grype, verifying its signed checksums
        id: grype
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GRYPE_VERSION: 0.118.0
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "no grype asset wired for $(uname -m)" >&2; exit 1; }
          dir="$RUNNER_TEMP/grype"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          sums="grype_${GRYPE_VERSION}_checksums.txt"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          for f in "$sums" "$sums.sig" "$sums.pem" "$tarball"; do
            curl --fail --silent --show-error --location --retry 3 -O "$base/$f"
          done
          signer="https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main"
          cosign verify-blob "$sums" \
            --signature "$sums.sig" \
            --certificate "$sums.pem" \
            --certificate-identity "$signer" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          grep " ${tarball}\$" "$sums" | sha256sum --check --strict -
          tar -xzf "$tarball" grype
          ./grype version
          echo "cmd=$dir/grype" >>"$GITHUB_OUTPUT"

      # Policy is .grype.yaml at the repository root, read by grype itself, so a
      # local `grype` run and this step apply the same gate. Runs even when the
      # smoke test failed: a broken API and a vulnerable image are independent.
      # Exit 2 = fixable High/Critical found; exit 1 = grype itself failed.
      - name: Scan the image for fixable High/Critical vulnerabilities
        if: ${{ !cancelled() && steps.grype.outcome == 'success' }}
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: '"$GRYPE" docker:localhost/pulp-ci:dev --output table'

      - name: Record the image size
        run: |
          size=$(docker image inspect --format '{{.Size}}' localhost/pulp-ci:dev)
          layers=$(docker image inspect --format '{{len .RootFS.Layers}}' localhost/pulp-ci:dev)
          printf '### Image\n\n- size: %s MB (%s bytes)\n- layers: %s\n' \
            "$((size / 1000 / 1000))" "$size" "$layers" >>"$GITHUB_STEP_SUMMARY"

      # Without this a failure shows only the step that failed, and the reason
      # is always in the container log.
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --tail 150

      - name: Tear down
        if: always()
        run: docker compose -f compose.ci.yml down --volumes
