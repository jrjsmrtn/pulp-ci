#
# OpenSSF Scorecard: automated supply-chain checks of this repository.
#
# Public repositories only (ADR-0004): publishing results and uploading SARIF
# both fail on a private repository. The job is gated on the repository being
# known to be public, so it switches itself on when the repository goes public
# and needs no edit at that point.
---
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 1" # weekly, Mondays
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # `== false` rather than `!private`: if the repository field is absent from
    # the event, `!null` is true and the job would run on a private repository.
    # This form skips unless the repository is known to be public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result
      id-token: write # publish results to the OpenSSF API
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
