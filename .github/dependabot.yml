#
# Keeps two kinds of pin current. A pin nobody moves is a pin that silently
# misses security fixes.
#
# - github-actions: the SHA-pinned actions in .github/workflows. Dependabot
#   moves the SHA and the trailing `# vX.Y.Z` comment together.
# - docker: the digest-pinned python:3.14-slim base in the Containerfile. Each
#   proposal is a pull request, so CI builds it, smoke-tests it and runs the
#   grype scan before anyone merges it.
#
# Not pip: the image's Python dependencies are deliberately unpinned (ADR-0003),
# so there is nothing for it to update.
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Gitflow-lite (ADR-0002): changes land on develop, never directly on main.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    # One PR per week for all actions rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Brussels
    # No ignore rule: Python minor and major bumps arrive as pull requests too,
    # and are merged only after bin/measure.sh has been run on both
    # architectures. (An earlier rule meant to hold them back named `python`;
    # Dependabot calls the image `library/python`, so it never matched. Its
    # first run proposed 3.14, which was measured and adopted, PR #2.)
    commit-message:
      prefix: build
    open-pull-requests-limit: 2
